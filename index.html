<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☕🐾 Cozy Cat Café</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #e8d5b5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 245, 225, 0.4) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(255, 235, 200, 0.3) 0%, transparent 35%);
            overflow: hidden;
        }

        /* === FLOATING BACKGROUND DECORATIONS === */
        .bg-float {
            position: fixed;
            font-size: 2rem;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            animation: bgFloat 20s infinite ease-in-out;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        /* === MAIN GAME CARD === */
        .game-wrapper {
            background: #fdf6ed;
            border-radius: 56px;
            padding: 28px 32px 32px 32px;
            box-shadow: 
                0 30px 40px rgba(120, 80, 50, 0.2),
                0 12px 20px rgba(120, 80, 50, 0.12),
                inset 0 2px 8px rgba(255, 255, 255, 0.8),
                inset 0 -4px 8px rgba(180, 140, 100, 0.15);
            border: 4px solid #e9d5bc;
            max-width: 900px;
            width: 100%;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* cute paw pattern overlay */
        .game-wrapper::before {
            content: "🐾 🐾 🐾 🐾 🐾 🐾 🐾 🐾";
            position: absolute;
            top: -20px;
            left: 0;
            right: 0;
            font-size: 80px;
            opacity: 0.04;
            letter-spacing: 30px;
            pointer-events: none;
            transform: rotate(-5deg);
            white-space: nowrap;
        }

        /* === STATS BAR === */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #f3e3d0 0%, #e8d3b8 100%);
            border-radius: 100px;
            padding: 8px 16px 8px 20px;
            margin-bottom: 22px;
            border: 2px solid #c9a87c;
            box-shadow: 
                inset 0 2px 6px rgba(255, 248, 235, 0.8),
                inset 0 -3px 6px rgba(150, 110, 70, 0.2),
                0 6px 0 #b28f6b,
                0 10px 18px rgba(100, 70, 40, 0.12);
            position: relative;
            z-index: 2;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fefaf3;
            padding: 6px 16px;
            border-radius: 40px;
            box-shadow: 
                inset 0 2px 4px rgba(255, 255, 255, 0.9),
                inset 0 -2px 4px rgba(180, 140, 100, 0.15),
                0 2px 0 #c9a87c;
            border: 1px solid #e6d0b8;
            transition: transform 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        .stat.pulse {
            animation: statPulse 0.4s ease;
        }

        @keyframes statPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); background: #fff7e0; }
            100% { transform: scale(1); }
        }

        .stat span:first-child {
            font-size: 1.4rem;
            line-height: 1;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.1));
            display: inline-block;
        }

        .stat span:first-child.spin {
            animation: coinSpin 0.6s ease;
        }

        @keyframes coinSpin {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.3); }
            100% { transform: rotateY(360deg) scale(1); }
        }

        .stat-value {
            font-size: 1.15rem;
            min-width: 38px;
            text-align: center;
            color: #4a3426;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        /* === MAIN LAYOUT === */
        .cafe-scene {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 18px;
            position: relative;
            z-index: 2;
        }

        /* === ACTION PANEL (LEFT) === */
        .action-panel {
            background: linear-gradient(145deg, #f0e0cd 0%, #e3d0b8 100%);
            border-radius: 40px;
            padding: 20px 18px;
            box-shadow: 
                inset 0 3px 10px rgba(255, 248, 240, 0.9),
                inset 0 -4px 8px rgba(160, 120, 80, 0.12),
                0 8px 0 #b5936e,
                0 14px 24px rgba(100, 70, 40, 0.15);
            border: 2px solid #d4b896;
            min-width: 220px;
            flex: 1 1 220px;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            text-align: center;
            margin: 0 0 16px 0;
            font-size: 1.1rem;
            color: #4a3426;
            text-shadow: 0 1px 0 rgba(255, 245, 230, 0.9);
            letter-spacing: 2px;
            font-weight: 700;
            background: linear-gradient(180deg, #e2cdb2, #d4bc9c);
            padding: 8px 0;
            border-radius: 30px;
            border: 1px solid #b8956e;
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.6), 0 2px 0 #a5825e;
            animation: titleGlow 3s infinite ease-in-out;
        }

        @keyframes titleGlow {
            0%, 100% { box-shadow: inset 0 1px 3px rgba(255,255,255,0.6), 0 2px 0 #a5825e; }
            50% { box-shadow: inset 0 1px 3px rgba(255,255,255,0.9), 0 2px 0 #a5825e, 0 0 12px rgba(255, 200, 120, 0.5); }
        }

        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn {
            background: linear-gradient(180deg, #fffaf2 0%, #f7e9d7 100%);
            border: none;
            border-radius: 40px;
            padding: 12px 14px;
            font-weight: 700;
            color: #3f2c1b;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 
                0 4px 0 #b5936e,
                0 6px 12px rgba(100, 70, 40, 0.12),
                inset 0 1px 3px rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.1s ease;
            border: 1px solid #e6d0b8;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::after {
            left: 100%;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b5936e, 0 2px 6px rgba(100, 70, 40, 0.1);
        }

        .btn:disabled {
            opacity: 0.45;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b5936e;
            pointer-events: none;
            filter: grayscale(0.4);
        }

        .btn span:first-child {
            font-size: 1.25rem;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.1));
            display: inline-block;
        }

        .btn:hover span:first-child {
            animation: iconWiggle 0.5s ease;
        }

        @keyframes iconWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-12deg); }
            75% { transform: rotate(12deg); }
        }

        .ingredient-cost {
            font-size: 0.75rem;
            background: #ebd9c4;
            padding: 3px 8px;
            border-radius: 20px;
            margin-left: 4px;
            font-weight: 600;
            color: #5a4230;
            border: 1px solid #d4bc9c;
        }

        .btn-drink {
            background: linear-gradient(180deg, #fff5e8 0%, #f0e0c8 100%);
        }

        .btn-cat {
            background: linear-gradient(180deg, #fff0e0 0%, #f5dfc5 100%);
        }

        /* === RELAX METER === */
        .relax-meter {
            background: linear-gradient(180deg, #f3e3d0 0%, #e8d3b8 100%);
            border-radius: 100px;
            padding: 12px 18px;
            border: 2px solid #c9a87c;
            box-shadow: 
                inset 0 2px 5px rgba(255, 248, 235, 0.9),
                inset 0 -3px 6px rgba(150, 110, 70, 0.15),
                0 4px 0 #b28f6b;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: auto;
        }

        .meter-label {
            font-weight: 700;
            color: #4a3426;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            white-space: nowrap;
            text-shadow: 0 1px 0 rgba(255, 245, 230, 0.8);
        }

        .meter-label span {
            animation: heartBeat 1.5s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .meter-bar-bg {
            flex: 1;
            height: 22px;
            background: #ccb69b;
            border-radius: 20px;
            box-shadow: inset 0 3px 8px #8b6f53, inset 0 -1px 2px rgba(255, 255, 255, 0.3);
            overflow: hidden;
            position: relative;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffb347, #ff8c42, #ff6f61);
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.6s ease;
            box-shadow: 0 0 12px rgba(255, 140, 66, 0.6);
            position: relative;
            overflow: hidden;
        }

        .meter-fill::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* === CAT & DRINK PANEL (RIGHT) === */
        .cat-drink-panel {
            background: linear-gradient(145deg, #f0e0cd 0%, #e3d0b8 100%);
            border-radius: 40px;
            padding: 20px 18px;
            box-shadow: 
                inset 0 3px 10px rgba(255, 248, 240, 0.9),
                inset 0 -4px 8px rgba(160, 120, 80, 0.12),
                0 8px 0 #b5936e,
                0 14px 24px rgba(100, 70, 40, 0.15);
            border: 2px solid #d4b896;
            flex: 2 1 360px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-label {
            font-size: 0.95rem;
            color: #4a3426;
            text-shadow: 0 1px 0 rgba(255, 245, 230, 0.9);
            font-weight: 700;
            margin: 0 0 4px 0;
            background: linear-gradient(180deg, #e2cdb2, #d4bc9c);
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid #b8956e;
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.6), 0 2px 0 #a5825e;
            letter-spacing: 0.8px;
        }

        .cat-list, .drink-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 80px;
            background: rgba(250, 240, 228, 0.7);
            border-radius: 30px;
            padding: 14px;
            border: 1px solid #c9af91;
            box-shadow: inset 0 3px 8px rgba(140, 100, 60, 0.12), inset 0 -1px 2px rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
            align-content: flex-start;
            transition: background 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .cat-list:hover, .drink-list:hover {
            background: rgba(252, 245, 235, 0.85);
        }

        /* === ANIMATED CAT ITEMS === */
        .cat-item {
            background: linear-gradient(180deg, #fffaf2 0%, #f7ede0 100%);
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 
                0 3px 0 #c9a87c,
                0 5px 10px rgba(100, 70, 40, 0.12),
                inset 0 1px 3px rgba(255, 255, 255, 0.8);
            border: 1px solid #e3cdb5;
            font-weight: 700;
            color: #4d3724;
            font-size: 0.9rem;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            cursor: pointer;
            overflow: visible;
        }

        .cat-item:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 0 #c9a87c, 0 10px 18px rgba(100, 70, 40, 0.18);
            z-index: 5;
        }

        .cat-item span:first-child {
            font-size: 1.35rem;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.08));
            animation: catBounce 2s infinite ease-in-out;
            display: inline-block;
            transform-origin: bottom center;
        }

        .cat-item:nth-child(2n) span:first-child {
            animation-delay: 0.3s;
            animation-duration: 2.4s;
        }
        .cat-item:nth-child(3n) span:first-child {
            animation-delay: 0.6s;
            animation-duration: 2.8s;
        }
        .cat-item:nth-child(4n) span:first-child {
            animation-delay: 0.9s;
            animation-duration: 2.2s;
        }
        .cat-item:nth-child(5n) span:first-child {
            animation-delay: 1.2s;
            animation-duration: 3s;
        }

        @keyframes catBounce {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-4px) rotate(3deg); }
        }

        /* Cat tail wag simulation */
        .cat-item::after {
            content: "〰️";
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            opacity: 0;
            animation: tailWag 1.5s infinite ease-in-out;
        }

        .cat-item:hover::after {
            opacity: 1;
        }

        @keyframes tailWag {
            0%, 100% { transform: translateY(-50%) rotate(-15deg); }
            50% { transform: translateY(-50%) rotate(15deg); }
        }

        @keyframes popIn {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* === ANIMATED DRINK ITEMS === */
        .drink-item {
            background: linear-gradient(180deg, #fffaf2 0%, #f7ede0 100%);
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 
                0 3px 0 #c9a87c,
                0 5px 10px rgba(100, 70, 40, 0.12),
                inset 0 1px 3px rgba(255, 255, 255, 0.8);
            border: 1px solid #e3cdb5;
            font-weight: 700;
            color: #4d3724;
            font-size: 0.9rem;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .drink-item span:first-child {
            font-size: 1.3rem;
            display: inline-block;
            animation: steamRise 2.5s infinite ease-in-out;
        }

        .drink-item:nth-child(2n) span:first-child {
            animation-delay: 0.4s;
        }
        .drink-item:nth-child(3n) span:first-child {
            animation-delay: 0.8s;
        }

        @keyframes steamRise {
            0%, 100% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(-4px) scale(1.08); opacity: 0.85; }
        }

        /* steam particles above drinks */
        .drink-item::before {
            content: "";
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, rgba(255,255,255,0.8), transparent 70%);
            border-radius: 50%;
            animation: steamPuff 2s infinite ease-out;
            pointer-events: none;
        }

        @keyframes steamPuff {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0.8; }
            100% { transform: translate(-50%, -20px) scale(2); opacity: 0; }
        }

        .empty-message {
            color: #b59a80;
            font-style: italic;
            padding: 16px;
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
            font-weight: 500;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        /* === LOG === */
        .log-area {
            background: linear-gradient(180deg, #e8d5bd 0%, #dcc6a8 100%);
            border-radius: 30px;
            padding: 14px 22px;
            margin-top: 6px;
            font-size: 0.9rem;
            color: #3e2e1f;
            font-weight: 600;
            min-height: 52px;
            max-height: 70px;
            overflow-y: auto;
            border: 2px solid #b28f6b;
            box-shadow: 
                inset 0 3px 8px rgba(140, 100, 60, 0.25),
                inset 0 -1px 3px rgba(255, 255, 255, 0.4),
                0 4px 0 #a5825e,
                0 8px 16px rgba(100, 70, 40, 0.1);
            text-align: center;
            letter-spacing: 0.3px;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
            transition: background 0.3s ease;
        }

        .log-area.flash {
            animation: logFlash 0.5s ease;
        }

        @keyframes logFlash {
            0% { background: #f5e6d0; }
            100% { background: linear-gradient(180deg, #e8d5bd 0%, #dcc6a8 100%); }
        }

        /* === FLOATING PARTICLES === */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 1.5rem;
            animation: floatUp 1.2s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.8) rotate(30deg); opacity: 0; }
        }

        /* === COIN SPARKLE === */
        .sparkle {
            position: fixed;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #fff8a0, #ffd700);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: sparklePop 0.8s ease-out forwards;
            box-shadow: 0 0 8px #ffd700;
        }

        @keyframes sparklePop {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* === CAT WALKING IN CAFÉ SCENE === */
        .walking-cat {
            position: absolute;
            font-size: 2rem;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
        }

        @keyframes walkAcross {
            0% { transform: translateX(-60px) scaleX(1); }
            49% { transform: translateX(calc(100% + 60px)) scaleX(1); }
            50% { transform: translateX(calc(100% + 60px)) scaleX(-1); }
            99% { transform: translateX(-60px) scaleX(-1); }
            100% { transform: translateX(-60px) scaleX(1); }
        }

        /* responsive */
        @media (max-width: 650px) {
            .game-wrapper { padding: 20px 18px 24px; border-radius: 40px; }
            .stats-bar { flex-wrap: wrap; gap: 8px; justify-content: center; }
            .stat { padding: 4px 12px; }
            .cafe-scene { flex-direction: column; }
            .action-panel { min-width: unset; }
            .btn { padding: 10px 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <!-- Floating background emojis -->
    <div class="bg-float" style="top: 10%; left: 5%; animation-delay: 0s;">☕</div>
    <div class="bg-float" style="top: 70%; left: 8%; animation-delay: 3s;">🐾</div>
    <div class="bg-float" style="top: 20%; right: 6%; animation-delay: 6s;">🐱</div>
    <div class="bg-float" style="top: 80%; right: 10%; animation-delay: 9s;">🧺</div>
    <div class="bg-float" style="top: 45%; left: 3%; animation-delay: 12s;">💖</div>
    <div class="bg-float" style="top: 55%; right: 4%; animation-delay: 15s;">✨</div>

    <div class="game-wrapper" id="gameWrapper">
        <!-- Stats bar -->
        <div class="stats-bar">
            <div class="stat" id="coinStat"><span id="coinIcon">🪙</span> <span class="stat-value" id="coinDisplay">100</span></div>
            <div class="stat" id="ingredientStat"><span>🧺</span> <span class="stat-value" id="ingredientDisplay">5</span></div>
            <div class="stat" id="catStat"><span>🐱</span> <span class="stat-value" id="catCountDisplay">0</span></div>
            <div class="stat" id="drinkStat"><span>☕</span> <span class="stat-value" id="drinkCountDisplay">0</span></div>
        </div>

        <!-- Main content -->
        <div class="cafe-scene" id="cafeScene">
            <!-- Left: Actions -->
            <div class="action-panel">
                <div class="panel-title">🐾  ACTIONS  🐾</div>
                <div class="button-grid">
                    <button class="btn" id="buyIngredientsBtn"><span>🧺</span> Buy Ingredients <span class="ingredient-cost">(10🪙)</span></button>
                    <button class="btn btn-drink" id="craftDrinkBtn"><span>☕</span> Craft Latte <span class="ingredient-cost">(2🧺)</span></button>
                    <button class="btn btn-cat" id="adoptCatBtn"><span>🐈</span> Adopt Stray Cat <span class="ingredient-cost">(30🪙)</span></button>
                    <button class="btn" id="serveDrinkBtn"><span>🍵</span> Serve Drink <span class="ingredient-cost">(+25🪙 +relax)</span></button>
                </div>
                <div class="relax-meter">
                    <div class="meter-label"><span>😌</span> Relax</div>
                    <div class="meter-bar-bg">
                        <div class="meter-fill" id="relaxFill" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- Right: Cats & Drinks -->
            <div class="cat-drink-panel">
                <div class="section-label">🐱  RESIDENT CATS</div>
                <div class="cat-list" id="catList">
                    <div class="empty-message">No cats yet... adopt a stray!</div>
                </div>
