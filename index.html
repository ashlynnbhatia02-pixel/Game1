<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Cold Case</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="case-file" id="app">

    <header class="header">
      <div class="header-top">
        <div class="stamp">OPEN CASE</div>
        <div class="timer" id="timer" hidden>⏱ <span id="timerValue">90</span>s</div>
      </div>
      <h1 id="caseTitle">Loading…</h1>
      <div class="case-id" id="caseId"></div>
    </header>

    <section class="scene" id="scene"></section>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="evidence" role="tab">📋 Evidence</button>
      <button class="tab" data-tab="suspects" role="tab">🕵️ Suspects</button>
    </nav>

    <div class="tab-panels" id="tabPanels">

      <section class="tab-panel active" data-panel="evidence">
        <ul class="clues" id="clues"></ul>
      </section>

      <section class="tab-panel" data-panel="suspects">
        <div class="suspects" id="suspects"></div>
      </section>

    </div>

    <button id="accuseBtn" disabled>Accuse Suspect</button>

    <div class="result" id="result"></div>

    <footer class="footer">
      <span id="levelLabel">Level 1 of 100</span>
      <button id="nextCaseBtn" class="link-btn" hidden>Next Case →</button>
    </footer>

  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
