<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cold Case</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="case-file" id="app">

    <header class="header">
      <div class="stamp">OPEN CASE</div>
      <h1 id="caseTitle">Loading…</h1>
      <div class="case-id" id="caseId"></div>
    </header>

    <section class="scene" id="scene"></section>

    <h2>Evidence</h2>
    <ul class="clues" id="clues"></ul>

    <h2>Suspects</h2>
    <div class="suspects" id="suspects"></div>

    <button id="accuseBtn" disabled>Accuse Suspect</button>

    <div class="result" id="result"></div>

    <footer class="footer">
      <span id="levelLabel">Level 1 of 100</span>
      <button id="nextCaseBtn" class="link-btn" hidden>Next Case →</button>
    </footer>

  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
